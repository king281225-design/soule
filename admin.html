<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Soulé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page admin-page" style="max-width:900px;">

    <div id="login-view" class="admin-login-wrap">
      <h1 class="font-display" style="font-size:22px;">Staff Login</h1>
      <p style="font-size:13px; color: var(--color-text-muted);">
        Requires a deployed backend (see backend/README.md) and its ADMIN_PASSWORD secret.
      </p>
      <input id="password-input" type="password" placeholder="Admin password" />
      <button id="login-btn" class="btn-primary">Log In</button>
      <p id="login-error" style="display:none; color:#c0392b; font-size:13px; margin-top:10px;"></p>
    </div>

    <div id="board-view" style="display:none">
      <div class="admin-header">
        <h1>Live Orders</h1>
        <button id="logout-btn" class="admin-logout">Log out</button>
      </div>
      <div id="admin-board" class="admin-board"></div>
    </div>

  </div>

  <script src="js/admin.js"></script>
</body>
</html>
