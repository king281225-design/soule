<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Placed — Soulé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="confirmation">
      <div class="check">✓</div>
      <h1 class="font-display" style="font-size:22px; margin:0 0 4px;">Order Placed</h1>
      <p id="order-meta" style="font-size:13px; color: var(--color-text-muted); margin:0;"></p>
      <p style="font-size:13px; margin-top:16px;">Your order has been sent to the restaurant.</p>
      <p id="pos-note" style="font-size:12px; color: var(--color-text-muted);"></p>

      <div id="status-steps" class="status-steps"></div>

      <a href="menu.html" class="btn-primary" style="max-width:200px;margin:32px auto 0;">Order More</a>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/order-status.js"></script>
</body>
</html>
