<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Soulé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <h1 class="page-title font-display">Checkout</h1>

    <p style="padding:4px 16px 0; font-size:12px; color: var(--color-text-muted);">Order type</p>
    <div class="order-type-row">
      <button id="type-dinein" class="order-type-btn" type="button">Dine-in</button>
      <button id="type-takeaway" class="order-type-btn" type="button">Takeaway</button>
    </div>
    <p id="table-hint" style="display:none; padding:0 16px 16px; font-size:12px; color: var(--color-text-muted);">
      Scan the QR code on your table to enable dine-in ordering.
    </p>

    <div class="field-group">
      <label for="name">Name (optional)</label>
      <input id="name" type="text" placeholder="Name" />
    </div>
    <div class="field-group">
      <label for="phone">Mobile number (optional)</label>
      <input id="phone" type="tel" placeholder="Mobile number" />
    </div>

    <div style="margin-top: 16px;">
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="sum-subtotal"></span>
      </div>
      <div class="summary-row">
        <span>Taxes</span>
        <span id="sum-tax"></span>
      </div>
      <div class="summary-row total">
        <span>Grand Total</span>
        <span id="sum-total"></span>
      </div>
    </div>

    <p id="error-msg" style="display:none; color:#c0392b; font-size:13px; padding:12px 16px 0;"></p>

    <div class="checkout-bar">
      <button id="place-order-btn" class="btn-primary" type="button">Place Order</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/table.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
